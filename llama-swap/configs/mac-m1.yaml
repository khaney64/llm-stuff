# llama-swap config for mac-m1 (Apple M1 Mac mini, 8GB unified memory).
#
# Same shape as llmserver.yaml/devbox.yaml: llama-swap owns the llama.cpp
# process lifetime, proxies through proxy.js on 127.0.0.1:8081 for telemetry,
# and takes every model-specific llama.cpp setting from the host launcher
# (llama-swap/macos/server.sh) rather than duplicating it here.
#
# Both models are small enough to stay resident together in 8GB (coder weights
# ~1.04GB + ~0.9GB KV at 32768 ctx, nomic ~0.26GB), so the groups block below
# keeps them co-resident rather than swapping. nomic-embed is real infrastructure
# now: grepai instances point here instead of devbox, where the 35b/27b crowd
# nomic out of VRAM and it falls back to CPU.
healthCheckTimeout: 600
unloadTimeout: 60
globalTTL: 0

models:
  qwen25-coder-1.5b:
    name: Qwen2.5 Coder 1.5B Instruct Q4_K_M
    cmd: ./llama-swap/macos/server.sh --model qwen25-coder-1.5b --port 8082 --host 127.0.0.1
    proxy: http://127.0.0.1:8081
    checkEndpoint: /health
    useModelName: qwen25-coder-1.5b

  # Same weights as qwen25-coder-1.5b, served by MLX instead of llama.cpp, so
  # the two backends can be compared by model id in a single request rather
  # than by editing this file back and forth. MLX cannot read GGUF, so this is
  # a separate ~880MB download. See m1-discovery-plan.md section 4.
  qwen25-coder-1.5b-mlx:
    name: Qwen2.5 Coder 1.5B Instruct 4bit (MLX)
    cmd: ./llama-swap/macos/server-mlx.sh --model qwen25-coder-1.5b-mlx --port 8082 --host 127.0.0.1
    proxy: http://127.0.0.1:8081
    checkEndpoint: /health
    useModelName: qwen25-coder-1.5b-mlx

  nomic-embed:
    name: Nomic Embed Text v1.5 F16
    cmd: ./llama-swap/macos/server.sh --model nomic-embed --port 8082 --host 127.0.0.1
    proxy: http://127.0.0.1:8081
    checkEndpoint: /health
    useModelName: nomic-embed
    aliases:
      - nomic-embed-text
      - nomic-embed-text-v1.5

# nomic-embed is persistent: grepai calls it constantly and it must never be
# evicted. The two coder variants share a swapping group because they are the
# same weights on different backends and are never needed at once. Neither group
# is exclusive, so loading a coder leaves the embedding model up.
#
# Ungrouped models default to swap:true + exclusive:true (one model at a time,
# unloads everything else); every model here is grouped, so that never applies.
#
# NOT YET SAFE TO APPLY. Every model below launches on 8082 and proxies through
# 8081, so the moment these groups keep two of them resident the second
# llama-server cannot bind 8082, /health never answers, and llama-swap blocks
# for the full 600s healthCheckTimeout. The running llama-swap predates this
# block and is unaffected; a restart-swap would apply it. Fix the ports first —
# see multi-model-ports-plan.md.
groups:
  embed:
    persistent: true
    swap: false
    exclusive: false
    members:
      - nomic-embed

  coder:
    swap: true
    exclusive: false
    members:
      - qwen25-coder-1.5b
      - qwen25-coder-1.5b-mlx

hooks:
  on_startup:
    preload:
      - qwen25-coder-1.5b
      - nomic-embed
