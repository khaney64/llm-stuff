    cmd: >-
      C:\development\ai\TensorFold\zig-out\native\bin\tensorfold-native.exe serve
      TensorFold/Qwen3.8-27B-MLX-4bit --name qwen27-tf
      --drafter z-lab/Qwen3.8-27B-DFlash2
      --host 127.0.0.1 --port 8082 --context 73728 --parallel 1
    proxy: http://127.0.0.1:8081
    checkEndpoint: /health
    useModelName: qwen27-tf

  qwenflash-st:
    name: Qwen3.8 Flash Next IQ3_S (Strata, 200K)
    env:
      - PYTHONUTF8=1
    cmd: >-
      C:\development\ai\Strata\terminal\.venv\Scripts\python.exe
      C:\development\ai\Strata\terminal\strata.py serve
      --profile C:\development\ai\Strata-data\qwenflash-st.json
      --host 127.0.0.1 --port 8082 --shutdown-timeout 30
    proxy: http://127.0.0.1:8081
    checkEndpoint: /v1/models
    useModelName: qwen3.8-flash-next-iq3_s

  qwenflash-lc:
