healthCheckTimeout: 1200
unloadTimeout: 60
globalTTL: 0

models:
  qwen36-35b:
    name: Qwen 3.6 35B A3B
    cmd: >-
      pwsh.exe -NoProfile -ExecutionPolicy Bypass
      -File C:\development\ai\llama.cpp\pre-built\server.ps1
      -Build b12359 -Model qwen36-35b -Port 8082 -ListenHost 127.0.0.1
    proxy: http://127.0.0.1:8081
    checkEndpoint: /health
    useModelName: qwen36-35b-a3b
    aliases:
      - qwen36-35b-a3b

