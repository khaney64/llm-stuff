# telegraf-sysmetrics.conf
# Drop this file into your Telegraf container's conf.d/ directory.
# Subscribes to all topics published by sysmetrics.py and writes to InfluxDB.
#
# Topics consumed:
#   metrics/{hostname}/cpu
#   metrics/{hostname}/gpu/{index}
#   metrics/{hostname}/memory
#   metrics/{hostname}/disk/{device}
#   metrics/{hostname}/disk/{device}/io
#   metrics/{hostname}/network/{iface}
#   metrics/{hostname}/system
#   metrics/{hostname}/llm          (llmserver only)

[[inputs.mqtt_consumer]]
  ## MQTT broker address
  servers = ["tcp://YOUR_MQTT_BROKER:1883"]

  ## Subscribe to all sysmetrics topics
  topics = ["metrics/#"]

  ## Payload is InfluxDB line protocol
  data_format = "influx"

  ## Optional: MQTT client ID (must be unique per Telegraf instance)
  # client_id = "telegraf-sysmetrics"

  ## Optional: credentials
  # username = ""
  # password = ""

  ## QoS 0 is fine — we tolerate missed samples
  qos = 0

  ## Keep alive
  connection_timeout = "30s"
